services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE=sigecBD
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - './db_data:/var/lib/mysql'
    ports:
      - "3306:3306"

  app:
    build:
      context: .
    environment:
      NODE_ENV: production
      JWT_SECRET: dtrfi76tg8768g5r867g4
      JWT_EXPIRES: 24h
      DATABASE_URL: "mysql://root:@db:3306/sigecBD"
    depends_on:
      - db
    ports:
      - 3000:3000